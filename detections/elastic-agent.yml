inputs:
  - id: winlog-windows-9f374eee-beab-48cf-961b-4a8d420c38ac
    name: windows-1
    revision: 1
    type: winlog
    use_output: default
    meta:
      package:
        name: windows
        version: 3.10.0
    data_stream:
      namespace: default
    package_policy_id: 9f374eee-beab-48cf-961b-4a8d420c38ac
    streams:
      - id: winlog-windows.forwarded-9f374eee-beab-48cf-961b-4a8d420c38ac
        name: ForwardedEvents
        data_stream:
          dataset: windows.forwarded
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
        tags:
          - forwarded
        publisher_pipeline.disable_host: true
        processors:
          - translate_sid:
              field: winlog.event_data.MemberSid
              account_name_target: winlog.event_data._MemberUserName
              domain_target: winlog.event_data._MemberDomain
              account_type_target: winlog.event_data._MemberAccountType
              ignore_missing: true
              ignore_failure: true
          - decode_xml:
              when:
                and:
                  - has_fields:
                      - winlog.event_data.TaskContent
                  - equals:
                      winlog.provider_name: Microsoft-Windows-Security-Auditing
                  - regexp:
                      winlog.channel: '^[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]$'
              field: winlog.event_data.TaskContent
              target_field: winlog._tmp.scheduled_task.task_content
              to_lower: true
              ignore_missing: true
              ignore_failure: true
          - decode_xml:
              when:
                and:
                  - has_fields:
                      - winlog.event_data.TaskContentNew
                  - equals:
                      winlog.provider_name: Microsoft-Windows-Security-Auditing
                  - regexp:
                      winlog.channel: '^[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]$'
              field: winlog.event_data.TaskContentNew
              target_field: winlog._tmp.scheduled_task.task_content_new
              to_lower: true
              ignore_missing: true
              ignore_failure: true
      - id: winlog-windows.powershell-9f374eee-beab-48cf-961b-4a8d420c38ac
        name: Windows PowerShell
        data_stream:
          dataset: windows.powershell
          type: logs
        condition: '${host.platform} == ''windows'''
        event_id: '400, 403, 600, 800'
        ignore_older: 72h
        processors:
          - translate_sid:
              field: winlog.event_data.MemberSid
              account_name_target: winlog.event_data._MemberUserName
              domain_target: winlog.event_data._MemberDomain
              account_type_target: winlog.event_data._MemberAccountType
              ignore_missing: true
              ignore_failure: true
      - id: >-
          winlog-windows.powershell_operational-9f374eee-beab-48cf-961b-4a8d420c38ac
        name: Microsoft-Windows-PowerShell/Operational
        data_stream:
          dataset: windows.powershell_operational
          type: logs
        condition: '${host.platform} == ''windows'''
        event_id: '4103, 4104, 4105, 4106'
        ignore_older: 72h
        processors:
          - translate_sid:
              field: winlog.event_data.MemberSid
              account_name_target: winlog.event_data._MemberUserName
              domain_target: winlog.event_data._MemberDomain
              account_type_target: winlog.event_data._MemberAccountType
              ignore_missing: true
              ignore_failure: true
      - id: winlog-windows.sysmon_operational-9f374eee-beab-48cf-961b-4a8d420c38ac
        name: Microsoft-Windows-Sysmon/Operational
        data_stream:
          dataset: windows.sysmon_operational
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
        processors:
          - translate_sid:
              field: winlog.event_data.MemberSid
              account_name_target: winlog.event_data._MemberUserName
              domain_target: winlog.event_data._MemberDomain
              account_type_target: winlog.event_data._MemberAccountType
              ignore_missing: true
              ignore_failure: true
      - id: winlog-windows.windows_defender-9f374eee-beab-48cf-961b-4a8d420c38ac
        name: Microsoft-Windows-Windows Defender/Operational
        data_stream:
          dataset: windows.windows_defender
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
        processors:
          - translate_sid:
              field: winlog.event_data.MemberSid
              account_name_target: winlog.event_data._MemberUserName
              domain_target: winlog.event_data._MemberDomain
              account_type_target: winlog.event_data._MemberAccountType
              ignore_missing: true
              ignore_failure: true
          - script:
              id: rename_fields_in_winlog_event_data_that_have_spaces
              lang: javascript
              source: |
                function process(event) {
                  var eventData = event.Get("winlog.event_data");
                  if (eventData !== null) {
                    var newEventData = {};
                    for (var key in eventData) {
                      if (eventData.hasOwnProperty(key)) {
                        var newKey = key.replace(/ /g, "_");
                        newEventData[newKey] = eventData[key];
                      }
                    }
                    event.Put("winlog.event_data", newEventData);
                  }
                }
  - id: windows/metrics-windows-9f374eee-beab-48cf-961b-4a8d420c38ac
    name: windows-1
    revision: 1
    type: windows/metrics
    use_output: default
    meta:
      package:
        name: windows
        version: 3.10.0
    data_stream:
      namespace: default
    package_policy_id: 9f374eee-beab-48cf-961b-4a8d420c38ac
    streams:
      - id: windows/metrics-windows.perfmon-9f374eee-beab-48cf-961b-4a8d420c38ac
        data_stream:
          dataset: windows.perfmon
          type: metrics
        metricsets:
          - perfmon
        condition: '${host.platform} == ''windows'''
        perfmon.group_measurements_by_instance: false
        perfmon.ignore_non_existent_counters: false
        perfmon.refresh_wildcard_counters: false
        perfmon.match_by_parent_instance: true
        perfmon.queries:
          - object: Process
            instance:
              - '*'
            counters:
              - name: '% Processor Time'
                field: cpu_perc
                format: float
              - name: Working Set
        period: 10s
      - id: windows/metrics-windows.service-9f374eee-beab-48cf-961b-4a8d420c38ac
        data_stream:
          dataset: windows.service
          type: metrics
        metricsets:
          - service
        condition: '${host.platform} == ''windows'''
        period: 60s
  - id: logfile-system-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
    name: system-1
    revision: 1
    type: logfile
    use_output: default
    meta:
      package:
        name: system
        version: 1.62.1
    data_stream:
      namespace: default
    package_policy_id: 60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
    streams:
      - id: logfile-system.auth-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.auth
          type: logs
        ignore_older: 72h
        paths:
          - /var/log/auth.log*
          - /var/log/secure*
        exclude_files:
          - \.gz$
        multiline:
          pattern: ^\s
          match: after
        tags:
          - system-auth
        processors:
          - add_locale: null
          - rename:
              fields:
                - from: message
                  to: event.original
              ignore_missing: true
              fail_on_error: false
          - syslog:
              field: event.original
              ignore_missing: true
              ignore_failure: true
      - id: logfile-system.syslog-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.syslog
          type: logs
        paths:
          - /var/log/messages*
          - /var/log/syslog*
          - /var/log/system*
        exclude_files:
          - \.gz$
        multiline:
          pattern: ^\s
          match: after
        processors:
          - add_locale: null
        tags: null
        ignore_older: 72h
  - id: winlog-system-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
    name: system-1
    revision: 1
    type: winlog
    use_output: default
    meta:
      package:
        name: system
        version: 1.62.1
    data_stream:
      namespace: default
    package_policy_id: 60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
    streams:
      - id: winlog-system.application-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        name: Application
        data_stream:
          dataset: system.application
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
      - id: winlog-system.security-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        name: Security
        data_stream:
          dataset: system.security
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
      - id: winlog-system.system-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        name: System
        data_stream:
          dataset: system.system
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
  - id: system/metrics-system-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
    name: system-1
    revision: 1
    type: system/metrics
    use_output: default
    meta:
      package:
        name: system
        version: 1.62.1
    data_stream:
      namespace: default
    package_policy_id: 60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
    streams:
      - id: system/metrics-system.cpu-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.cpu
          type: metrics
        metricsets:
          - cpu
        cpu.metrics:
          - percentages
          - normalized_percentages
        period: 10s
      - id: system/metrics-system.diskio-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.diskio
          type: metrics
        metricsets:
          - diskio
        diskio.include_devices: null
        period: 10s
      - id: system/metrics-system.filesystem-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.filesystem
          type: metrics
        metricsets:
          - filesystem
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.fsstat-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.fsstat
          type: metrics
        metricsets:
          - fsstat
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.fsstat.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.load-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.load
          type: metrics
        metricsets:
          - load
        condition: '${host.platform} != ''windows'''
        period: 10s
      - id: system/metrics-system.memory-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.memory
          type: metrics
        metricsets:
          - memory
        period: 10s
      - id: system/metrics-system.network-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.network
          type: metrics
        metricsets:
          - network
        period: 10s
        network.interfaces: null
      - id: system/metrics-system.process-60bad31a-6111-4d0e-ba8b-44b89c9eb0fe
        data_stream:
          dataset: system.process
          type: metrics
        metricsets:
          - process
        period: 10s
        process.include_top_n.by_cpu: 5
        process.include_top_n.by_memory: 5
        process.cmdline.cache.enabled: true
        process.cgroups.enabled: false
        process.include_cpu_ticks: false
        processes:
          - .*
      - id: >-
